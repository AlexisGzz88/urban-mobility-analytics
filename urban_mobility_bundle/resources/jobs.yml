resources:
  jobs:

    # ──────────────────────────────────────────────────────────────────────────
    # TRIPS pipeline  (4 tareas secuenciales)
    # ──────────────────────────────────────────────────────────────────────────
    trips_pipeline:
      name: "[${bundle.target}] UM — trips pipeline"
      existing_cluster_id: ${var.cluster_id}
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tasks:
        - task_key: metadata_generator
          notebook_task:
            notebook_path: ${var.project_root}/notebooks/00_metadata_generator
            source: WORKSPACE
            base_parameters:
              entity_name: trips
              catalog: ${var.catalog}

        - task_key: bronze_loader
          depends_on:
            - task_key: metadata_generator
          notebook_task:
            notebook_path: ${var.project_root}/notebooks/01_bronze_loader
            source: WORKSPACE
            base_parameters:
              entity_name: trips
              catalog: ${var.catalog}

        - task_key: silver_cleaner
          depends_on:
            - task_key: bronze_loader
          notebook_task:
            notebook_path: ${var.project_root}/notebooks/02_silver_cleaner
            source: WORKSPACE
            base_parameters:
              entity_name: trips
              catalog: ${var.catalog}

        - task_key: gold_aggregator
          depends_on:
            - task_key: silver_cleaner
          notebook_task:
            notebook_path: ${var.project_root}/notebooks/03_gold_aggregator
